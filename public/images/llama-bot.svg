  <path d="M24,70 C20,68 16,72 18,76 C20,80 26,78 24,74" fill="currentColor"/>
  <path d="M20,82 C16,80 13,85 16,88 C19,91 24,88 22,85" fill="currentColor"/>
  <path d="M26,58 C22,56 18,60 20,64 C22,68 28,66 26,62" fill="currentColor"/>

  <!-- Fluffy texture bumps right -->
  <path d="M96,70 C100,68 104,72 102,76 C100,80 94,78 96,74" fill="currentColor"/>
  <path d="M100,82 C104,80 107,85 104,88 C101,91 96,88 98,85" fill="currentColor"/>
  <path d="M94,58 C98,56 102,60 100,64 C98,68 92,66 94,62" fill="currentColor"/>

  <!-- White face area -->
