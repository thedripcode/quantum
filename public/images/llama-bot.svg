  <!-- Muzzle/snout oval -->
  <ellipse cx="60" cy="70" rx="14" ry="11" fill="currentColor" opacity="0.12"/>
  <ellipse cx="60" cy="70" rx="12" ry="9" fill="white"/>
  <ellipse cx="60" cy="70" rx="13" ry="10" fill="none" stroke="currentColor" stroke-width="1.5"/>

  <!-- Nose Y shape -->
  <path d="M60,65 L60,69 M60,69 L57,72 M60,69 L63,72"
    stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Bottom fluff -->
  <path d="M40,100 C36,102 32,106 36,108 C40,110 48,106 48,102" fill="currentColor"/>
  <path d="M60,102 C58,105 58,108 62,108 C66,108 66,105 64,102" fill="currentColor"/>
  <path d="M80,100 C84,102 88,106 84,108 C80,110 72,106 72,102" fill="currentColor"/>
