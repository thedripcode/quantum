    C16,74 18,82 24,88
    C30,94 38,98 48,100
    C52,101 56,102 60,102
    C64,102 68,101 72,100
    C82,98 90,94 96,88
    C102,82 104,74 102,64
    C100,56 100,52 96,42
    C92,26 76,15 60,15 Z"
