  <!-- Left eye -->
  <circle cx="50" cy="54" r="4" fill="currentColor"/>
  <circle cx="51.5" cy="52.5" r="1.2" fill="white"/>

  <!-- Right eye -->
  <circle cx="70" cy="54" r="4" fill="currentColor"/>
